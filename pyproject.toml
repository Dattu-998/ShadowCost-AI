[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadowcost"
version = "0.1.0"
description = "Finds repetitive spreadsheet and email work in small companies; its agents prove themselves in shadow mode before they are trusted."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shadowcost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

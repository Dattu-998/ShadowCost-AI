[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shadowcost"
version = "0.1.0"
description = "Finds repetitive spreadsheet and email work in small companies; its agents prove themselves in shadow mode before they are trusted."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "scipy>=1.11",
]

[project.scripts]
shadowcost-synth = "shadowcost.synth.__main__:main"
shadowcost-ingest = "shadowcost.ingest.__main__:main"
shadowcost-discover = "shadowcost.discover.__main__:main"
shadowcost-agent = "shadowcost.agent.__main__:main"
shadowcost-report = "shadowcost.report:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "stripe>=11",
    "cryptography>=43",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shadowcost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The data-card template contains Markdown table rows that can't be wrapped.
"src/shadowcost/synth/write.py" = ["E501"]
# API tests spell out full request paths.
"tests/test_saas.py" = ["E501"]

# Render Blueprint: the ShadowCost API.
# New > Blueprint in the Render dashboard, pick this repo, then set the two
# secret values when prompted.
services:
  - type: web
    name: shadowcost-api
    runtime: python
    plan: free
    buildCommand: pip install ".[api]"
    startCommand: uvicorn shadowcost.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SHADOWCOST_WORKSPACE
        value: /tmp/shadowcost
      # Your Vercel URL, e.g. https://shadowcost.vercel.app (comma-separate several).
      - key: SHADOWCOST_CORS_ORIGINS
        sync: false
      # --- the hosted product (each integration is optional; see docs/deploy.md) ---
      - key: SITE_URL
        value: https://shadow-cost-ai.vercel.app
      - key: API_URL
        value: https://shadowcost-api.onrender.com
      - key: SUPABASE_URL
        value: https://jyixkprzmihvuanprfdm.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false

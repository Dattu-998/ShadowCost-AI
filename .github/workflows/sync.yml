name: Daily connector sync

# Takes each workspace's daily Google Sheets snapshot and new Gmail headers.
# Needs the repository secrets API_URL (the Render URL) and CRON_SECRET (same as on Render).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.SYNC_ENABLED == 'true' }}
    steps:
      - name: Call the sync endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # The free API sleeps when idle; wake it first.
          curl --silent --show-error --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 "$API_URL/health"
          curl --fail --silent --show-error --max-time 300 -X POST -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/v1/cron/sync"
